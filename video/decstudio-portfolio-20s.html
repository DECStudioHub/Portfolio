function bg(t,base='#000000'){
  X.fillStyle=base; X.fillRect(0,0,W,H);
  const g=X.createRadialGradient(W*.5,H*.47,80,W*.5,H*.47,Math.max(W,H)*.76);
  g.addColorStop(0,'rgba(65,45,21,.18)');g.addColorStop(1,'rgba(0,0,0,.72)');X.fillStyle=g;X.fillRect(0,0,W,H);
  X.save();X.globalAlpha=.12;X.strokeStyle=palette.cream;X.lineWidth=1;
  for(let x=0;x<W;x+=96){X.beginPath();X.moveTo(x,0);X.lineTo(x,H);X.stroke();}
  for(let y=0;y<H;y+=96){X.beginPath();X.moveTo(0,y);X.lineTo(W,y);X.stroke();}
  X.restore();
  X.save(); X.globalAlpha=.22;
  for(let i=0;i<grain.length;i++){let p=grain[i], x=(p[0]+(i%2?t*19:-t*12)+W)%W,y=(p[1]+t*9+H)%H;X.fillStyle=i%3?'#E1DCC9':'#412D15';X.fillRect(x,y,p[2],p[2]);}
  X.restore();
}
function text(str,x,y,size,color=palette.cream,weight=700,align='left',tracking=0){
  X.save();X.fillStyle=color;X.textAlign=align;X.textBaseline='middle';X.font=`${weight} ${size}px Arial, "Segoe UI", sans-serif`;
  if(!tracking){X.fillText(str,x,y);}else{const chars=[...str],width=chars.reduce((a,ch)=>a+X.measureText(ch).width+tracking,0)-tracking;let px=x+(align==='center'?-width/2:align==='right'?-width:0);for(const ch of chars){X.fillText(ch,px,y);px+=X.measureText(ch).width+tracking;}}
  X.restore();
}
function line(x1,y1,x2,y2,color=palette.cream,width=2,alpha=1){X.save();X.globalAlpha=alpha;X.strokeStyle=color;X.lineWidth=width;X.beginPath();X.moveTo(x1,y1);X.lineTo(x2,y2);X.stroke();X.restore();}
function roundRect(x,y,w,h,r,fill,stroke=palette.wood,lw=2){X.beginPath();X.roundRect(x,y,w,h,r);if(fill){X.fillStyle=fill;X.fill();}if(stroke){X.lineWidth=lw;X.strokeStyle=stroke;X.stroke();}}
function imageCover(img,x,y,w,h,r=0){if(!img.complete||!img.naturalWidth)return;X.save();X.beginPath();X.roundRect(x,y,w,h,r);X.clip();const sc=Math.max(w/img.naturalWidth,h/img.naturalHeight),dw=img.naturalWidth*sc,dh=img.naturalHeight*sc;X.drawImage(img,x+(w-dw)/2,y+(h-dh)/2,dw,dh);X.restore();}
function hud(t,scene,label){
  const b=stageBounds,c=palette.cream;X.save();X.globalAlpha=.56;X.strokeStyle=c;X.lineWidth=2;
  const L=38;[[b.x,b.y,1,1],[b.x+b.w,b.y,-1,1],[b.x,b.y+b.h,1,-1],[b.x+b.w,b.y+b.h,-1,-1]].forEach(([x,y,sx,sy])=>{X.beginPath();X.moveTo(x+sx*L,y);X.lineTo(x,y);X.lineTo(x,y+sy*L);X.stroke();});X.restore();
  text('DECSTUDIO  /  PORTFOLIO',b.x+4,b.y+38,15,c,600,'left',2);text(`SCENE ${String(scene).padStart(2,'0')} / 07`,b.x+b.w-4,b.y+38,15,c,600,'right',1.6);
  line(b.x,b.y+b.h-31,b.x+180,b.y+b.h-31,c,2,.42);text(label.toUpperCase(),b.x+4,b.y+b.h-8,14,c,600,'left',2);

}

window.buildAudio=async function(ctx){
  const sr=ctx.sampleRate,dur=D;

  function bass(t,freq){const o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.value=freq;env(g,t,.015,.12,.5,.18,.13);o.connect(g);g.connect(master);o.start(t);o.stop(t+.34);}
  function blip(t,freq=680){const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(freq*1.5,t+.075);env(g,t,.002,.045,.25,.08,.085);o.connect(g);g.connect(master);o.start(t);o.stop(t+.16);}
  function boom(t){const o=ctx.createOscillator(),g=ctx.createGain(),s=ctx.createBufferSource(),ng=ctx.createGain(),f=ctx.createBiquadFilter();o.type='sine';o.frequency.setValueAtTime(80,t);o.frequency.exponentialRampToValueAtTime(28,t+.45);env(g,t,.004,.12,.45,.62,.45);o.connect(g);g.connect(master);o.start(t);o.stop(t+.9);s.buffer=noise;f.type='lowpass';f.frequency.value=1300;env(ng,t,.003,.035,.08,.28,.13);s.connect(f);f.connect(ng);ng.connect(master);s.start(t);s.stop(t+.4);}

};

const params=new URLSearchParams(location.search),renderMode=params.has('render');

let offset=0,startAt=0,ac=null,buf=null,source=null,playing=false;

function current(){return playing?(offset+ac.currentTime-startAt)%D:offset;}
async function play(){if(playing){pause();return;}ac??=new AudioContext();if(!buf){const off=new OfflineAudioContext(2,Math.ceil(48000*D),48000);await buildAudio(off);buf=await off.startRendering();}source=ac.createBufferSource();source.buffer=buf;source.connect(ac.destination);source.start(0,offset%D);startAt=ac.currentTime;playing=true;button.textContent='PAUSE';}
